<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rexify Automation Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { max-width: 800px; width: 100%; }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #38bdf8; text-align: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    .file-input { display: block; width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; color: #94a3b8; cursor: pointer; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .terminal { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; font-family: monospace; height: 380px; overflow-y: auto; color: #22c55e; font-size: 0.85rem; line-height: 1.5; }
    .log-line { margin-bottom: 4px; word-break: break-word; }
    .log-error { color: #ef4444; }
    .log-info { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rexify Automation Dashboard</h1>
    
    <div class="card">
      <form id="uploadForm">
        <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; color: #cbd5e1;">Upload CSV File (Bank Name & Account Number):</label>
        <input type="file" id="csvFile" accept=".csv" class="file-input" required />
        <button type="submit" id="startBtn">Start Automation</button>
      </form>
    </div>

    <div class="card">
      <div style="margin-bottom: 8px; font-size: 0.85rem; color: #94a3b8; font-weight: bold;">LIVE CONSOLE OUTPUT</div>
      <div class="terminal" id="terminal">
        <div class="log-line log-info">> System ready. Upload your CSV file to begin automation...</div>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const form = document.getElementById('uploadForm');
    const startBtn = document.getElementById('startBtn');

    function appendLog(text, type = '') {
      const line = document.createElement('div');
      line.className = 'log-line ' + (type ? `log-${type}` : '');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    const eventSource = new EventSource('/api/logs');
    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      appendLog(data.message, data.type);
      if (data.done) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start Automation';
      }
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('csvFile');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('csvFile', fileInput.files[0]);

      startBtn.disabled = true;
      startBtn.textContent = 'Running Automation...';
      appendLog('Uploading CSV file and kicking off task loop...', 'info');

      try {
        const response = await fetch('/api/start', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (!result.success) {
          appendLog(`Error: ${result.error}`, 'error');
          startBtn.disabled = false;
          startBtn.textContent = 'Start Automation';
        }
      } catch (err) {
        appendLog(`Server connection error: ${err.message}`, 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Start Automation';
      }
    });
  </script>
</body>
</html>
