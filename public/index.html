<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rexify Automation Control</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.3/index.css">
<style>
  :root{
    --black: #000000;
    --grey-950: #0a0a0a;
    --grey-900: #111111;
    --grey-800: #1a1a1a;
    --grey-700: #262626;
    --grey-500: #737373;
    --grey-300: #a3a3a3;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--black);
  }

  body {
    font-family: 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    width: 100%;
  }

  .header {
    margin-bottom: 40px;
  }

  .eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin-bottom: 10px;
  }

  h1 {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .status-card {
    background: var(--grey-950);
    border: 1px solid var(--grey-800);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    text-align: center;
  }

  .status-card p {
    font-size: 0.9rem;
    color: var(--grey-300);
    margin-bottom: 20px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease, border-color 0.15s ease, color 0.15s ease;
  }

  #startBtn {
    background: var(--white);
    color: var(--black);
  }

  #startBtn:hover { opacity: 0.85; }
  #startBtn:active { transform: scale(0.99); }

  #startBtn:disabled {
    background: var(--grey-700);
    color: var(--grey-500);
    cursor: not-allowed;
    opacity: 1;
  }

  #stopBtn {
    background: transparent;
    color: var(--grey-500);
    border: 1.5px solid var(--grey-700);
  }

  #stopBtn:hover:not(:disabled) {
    color: var(--white);
    border-color: var(--white);
  }

  #stopBtn:active:not(:disabled) { transform: scale(0.99); }

  #stopBtn:disabled {
    color: var(--grey-700);
    border-color: var(--grey-800);
    cursor: not-allowed;
  }

  .terminal-section {
    margin-top: 40px;
  }

  .terminal-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--grey-500);
  }

  .terminal {
    background: var(--grey-900);
    border: 1px solid var(--grey-800);
    border-radius: 12px;
    padding: 18px 20px;
    font-family: 'SF Mono', 'Geist Mono', ui-monospace, monospace;
    height: 340px;
    overflow-y: auto;
    font-size: 0.82rem;
    line-height: 1.7;
  }

  .terminal::-webkit-scrollbar { width: 8px; }
  .terminal::-webkit-scrollbar-thumb { background: var(--grey-700); border-radius: 8px; }
  .terminal::-webkit-scrollbar-track { background: transparent; }

  .log-line {
    color: var(--grey-300);
    word-break: break-word;
  }

  .log-line .ts {
    color: var(--grey-500);
    margin-right: 10px;
  }

  .log-info { color: var(--white); }
  .log-error { color: var(--grey-300); font-weight: 700; }
  .log-error::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--white);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="eyebrow">Rexify / Automation</div>
      <h1>Automation control</h1>
    </div>

    <div class="status-card">
      <p>Self-generating referral network engine is ready. Click start to launch autonomous execution.</p>
      <div class="btn-row">
        <button type="button" id="startBtn">Start automation</button>
        <button type="button" id="stopBtn" disabled>Stop</button>
      </div>
    </div>

    <div class="terminal-section">
      <div class="terminal-label"><span class="dot"></span>Live output</div>
      <div class="terminal" id="terminal">
        <div class="log-line log-info"><span class="ts">00:00:00</span>System ready. Click start automation to begin.</div>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    function appendLog(text, type = '') {
      const line = document.createElement('div');
      line.className = 'log-line ' + (type ? `log-${type}` : '');
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = new Date().toLocaleTimeString('en-GB');
      line.appendChild(ts);
      line.appendChild(document.createTextNode(text));
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function setRunningState(isRunning) {
      startBtn.disabled = isRunning;
      startBtn.textContent = isRunning ? 'Running...' : 'Start automation';
      stopBtn.disabled = !isRunning;
    }

    let eventSource;
    try {
      eventSource = new EventSource('/api/logs');
      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        appendLog(data.message, data.type);
        if (data.done) setRunningState(false);
      };
    } catch (e) {}

    startBtn.addEventListener('click', async () => {
      setRunningState(true);
      appendLog('Initializing self-generating referral engine...', 'info');

      try {
        const response = await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const result = await response.json();
        if (!result.success) {
          appendLog(`Error: ${result.error}`, 'error');
          setRunningState(false);
        }
      } catch (err) {
        appendLog(`Server connection error: ${err.message}`, 'error');
        setRunningState(false);
      }
    });

    stopBtn.addEventListener('click', async () => {
      stopBtn.disabled = true;
      stopBtn.textContent = 'Stopping...';
      appendLog('Stop signal sent. Waiting for current cycle to finish...', 'info');

      try {
        const response = await fetch('/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const result = await response.json();
        if (!result.success) {
          appendLog(`Error: ${result.error}`, 'error');
        }
      } catch (err) {
        appendLog(`Server connection error: ${err.message}`, 'error');
      } finally {
        stopBtn.textContent = 'Stop';
        setRunningState(false);
      }
    });

    async function syncServerStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        if (data.isRunning) {
          startBtn.disabled = true;
          startBtn.textContent = 'Running...';
          stopBtn.disabled = data.isStopping;
          stopBtn.textContent = data.isStopping ? 'Stopping...' : 'Stop';
        } else {
          startBtn.disabled = false;
          startBtn.textContent = 'Start automation';
          stopBtn.disabled = true;
          stopBtn.textContent = 'Stop';
        }
      } catch (err) {
        console.error('Failed to sync status:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', syncServerStatus);
  </script>
</body>
</html>
